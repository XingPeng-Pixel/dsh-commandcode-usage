name: Bug Report
description: 报告一个缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件版本或 commit
    validations:
      required: true
